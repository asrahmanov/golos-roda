name: svyaz-pokoleny

services:
  svyaz_db:
    image: postgres:16-alpine
    container_name: svyaz_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: svyaz
      POSTGRES_DB: svyaz
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      TZ: Europe/Moscow
    volumes:
      - ./data/postgres:/var/lib/postgresql/data
    networks: [internal]
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U svyaz -d svyaz']
      interval: 10s
      timeout: 5s
      retries: 10
    mem_limit: 512m
    logging: { driver: json-file, options: { max-size: 10m, max-file: '3' } }

  svyaz_app:
    build:
      context: .
      args:
        NEXT_PUBLIC_SITE_URL: ${SITE_URL}
    image: svyaz-pokoleny-app:latest
    container_name: svyaz_app
    restart: unless-stopped
    depends_on:
      svyaz_db: { condition: service_healthy }
    environment:
      DATABASE_URL: postgresql://svyaz:${DB_PASSWORD}@svyaz_db:5432/svyaz
      AUTH_SECRET: ${AUTH_SECRET}
      NEXT_PUBLIC_SITE_URL: ${SITE_URL}
      ADMIN_EMAIL: ${ADMIN_EMAIL}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD}
      COOKIE_SECURE: ${COOKIE_SECURE:-true}
    volumes:
      - ./data/storage:/data/storage
    networks: [internal, npm_network]
    mem_limit: 768m
    logging: { driver: json-file, options: { max-size: 10m, max-file: '3' } }

networks:
  internal:
    ipam:
      config:
        - subnet: 10.77.140.0/24
  npm_network:
    external: true
